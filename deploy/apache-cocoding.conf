# Reference vhost — copy to /etc/apache2/sites-available/cocoding.conf
# and adjust the path if you upload somewhere other than /var/www/cocoding.
#
# Layout expected:
#   /var/www/cocoding/public/    <- frontend/dist (npm run build 결과, DocumentRoot)
#   /var/www/cocoding/backend/   <- backend      (PHP source; only api/ is web-reachable)
#
# 필요한 모듈: sudo a2enmod headers rewrite
# 서버 전체 설정(/etc/apache2/conf-enabled/security.conf)에서 버전 숨기기 권장:
#   ServerTokens Prod
#   ServerSignature Off
# php.ini: expose_php = Off

<VirtualHost *:80>
    ServerName cocoding.co.kr
    ServerAlias www.cocoding.co.kr

    # HTTPS로만 접속 (certbot 발급 후). 발급 전 테스트할 때는 아래 3줄을 주석 처리
    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [L,R=301]

    DocumentRoot /var/www/cocoding/public
    <Directory /var/www/cocoding/public>
        AllowOverride None
        Require all granted
        # SPA 새로고침 대응: 없는 경로는 index.html로
        FallbackResource /index.html
    </Directory>

    # Backend API is served from a separate on-disk folder, exposed only
    # under /api — everything else in backend/ (config, models, .env, data, tools)
    # stays outside the DocumentRoot and is explicitly denied below.
    Alias /api /var/www/cocoding/backend/api
    <Directory /var/www/cocoding/backend/api>
        Require all granted
    </Directory>

    <Directory /var/www/cocoding/backend>
        Require all denied
    </Directory>

    # ── 보안 헤더 ──
    # 사이트(프론트엔드): 우리 서버의 스크립트만 실행, 다른 사이트에 끼워 넣기 금지.
    # style 'unsafe-inline'은 Blockly가 <style> 태그를 직접 넣기 때문에 필요.
    # 마이크는 소리 녹음 기능 때문에 우리 사이트에만 허용.
    <Directory /var/www/cocoding/public>
        Header always set Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' data: blob:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
        Header always set Permissions-Policy "camera=(), geolocation=(), microphone=(self)"
    </Directory>
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "DENY"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    # HTTPS에서만 의미 있음 (certbot이 만든 :443 vhost에도 그대로 복사됨)
    Header always set Strict-Transport-Security "max-age=31536000"
    Header always unset X-Powered-By
    Header unset X-Powered-By

    ErrorLog ${APACHE_LOG_DIR}/cocoding_error.log
    CustomLog ${APACHE_LOG_DIR}/cocoding_access.log combined
</VirtualHost>

# After `sudo certbot --apache -d cocoding.co.kr -d www.cocoding.co.kr`,
# certbot will generate the matching :443 VirtualHost automatically.

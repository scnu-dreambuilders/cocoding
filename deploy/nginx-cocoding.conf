# 코코딩 nginx 설정 예시 (cocoding.co.kr 운영 서버용)
#
# nginx는 .htaccess를 읽지 않는다. 저장소의 .htaccess 두 개(frontend/public, backend)가
# 하던 일을 여기로 옮겨 적어야 한다. 빠지면 생기는 일:
#   · 화면 주소 되돌리기가 없으면 /mypage, /gamezone 에서 새로고침할 때 404
#   · 접근 차단이 없으면 backend/data 의 로그·아이템 파일, .env 가 웹에서 열림
#
# 서버의 server { ... } 블록 안에 아래 location 들을 넣는다.
# 적용 전 `sudo nginx -t` 로 문법을 확인하고 `sudo systemctl reload nginx`.
#
# 배치 구조 (FTP업로드/public_html 을 웹 루트에 그대로 올린 모양)
#   웹루트/index.html, assets/      학생용 화면 (frontend 빌드)
#   웹루트/admin/                   관리자 화면 (admin 빌드, 주소는 /admin/)
#   웹루트/backend/api/             PHP API. backend 의 나머지 폴더는 웹에서 막는다
#
# 순서가 중요하다. nginx는 정규식 location 을 적힌 순서대로 보고 처음 맞는 것을 쓴다.
# 차단 규칙이 PHP 실행 규칙(location ~ \.php$)보다 위에 있어야 config/*.php 같은
# 파일이 실행되지 않는다.

server {
    listen 443 ssl http2;
    server_name cocoding.co.kr www.cocoding.co.kr;

    root /var/www/cocoding/public_html;   # 실제 웹 루트 경로로 바꾼다
    index index.html;

    # ssl_certificate 등은 certbot 이 넣어준 줄을 그대로 둔다

    # ── 1. 접근 차단 (PHP 규칙보다 위) ──────────────────────────────

    # 점으로 시작하는 파일: .env, .htaccess, .schema_version, .git 등.
    # 인증서 갱신에 쓰는 .well-known 은 열어둔다
    location ~ /\.(?!well-known) {
        deny all;
    }

    # backend 안에서 웹으로 부를 일이 없는 폴더. 설정·모델·데이터(로그, 아이템 파일)·
    # 관리 도구·채점기가 여기 있다
    location ~ ^/backend/(config|models|data|tools|grader)/ {
        deny all;
    }

    # backend 아래의 기록·설정·문서 파일. 위 규칙을 빠져나간 것이 있어도 여기서 막힌다
    location ~ ^/backend/.*\.(log|sql|md|json|example|env)$ {
        deny all;
    }

    # 웹 루트 어디에 있든 .log 와 .sql 은 내려주지 않는다
    location ~ \.(log|sql)$ {
        deny all;
    }

    # ── 2. PHP 실행: backend/api 아래만 ─────────────────────────────

    location ~ ^/backend/api/.+\.php$ {
        try_files $uri =404;                       # 없는 파일을 PHP로 넘기지 않는다
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php7.4-fpm.sock;  # 서버의 PHP 버전에 맞춘다
    }

    # api 밖의 .php 는 실행하지 않는다 (backend/router.php 는 개발용이다)
    location ~ \.php$ {
        return 404;
    }

    # 예전 주소(/api/...)로 부르는 요청은 /backend/api/ 로 넘긴다
    location /api/ {
        rewrite ^/api/(.*)$ /backend/api/$1 last;
    }

    # API 는 화면 주소 되돌리기 대상이 아니다. 없는 API 는 404 여야 한다
    location /backend/ {
        try_files $uri =404;
    }

    # ── 3. 화면 주소 되돌리기 (SPA) ─────────────────────────────────

    # 관리자 화면. 화면 이동은 주소 뒤의 #/... 로 하지만, /admin/ 자체는
    # admin/index.html 이 받아야 한다 (학생용 index.html 이 가로채면 안 된다)
    location /admin/ {
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files $uri $uri/ /admin/index.html;
    }

    # 학생용 화면. /home, /study, /mypage, /gamezone, /board, /editor/... 처럼
    # 파일이 없는 주소는 index.html 을 주고, 화면 코드가 주소를 보고 그린다
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── 4. 보안 헤더 (.htaccess 에 있던 것) ─────────────────────────
    # location 안에서 add_header 를 쓰면 여기 것이 그 location 에는 안 붙는다.
    # /admin/ 처럼 따로 add_header 를 쓴 곳에는 필요한 헤더를 다시 적어야 한다

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=(self)" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    server_tokens off;
}

# 적용 후 확인 (전부 맞아야 한다)
#   curl -I https://cocoding.co.kr/gamezone                          → 200 (index.html)
#   curl -I https://cocoding.co.kr/mypage                            → 200
#   curl -I https://cocoding.co.kr/admin/                            → 200, 제목 "코코딩 관리자"
#   curl -I https://cocoding.co.kr/backend/.env                      → 403
#   curl -I https://cocoding.co.kr/backend/data/items.json           → 403
#   curl -I https://cocoding.co.kr/backend/data/logs/admin-2026-11-22.log → 403
#   curl -I https://cocoding.co.kr/backend/config/Database.php       → 403
#   curl -s https://cocoding.co.kr/backend/api/admin/stats.php       → 401 JSON (로그인 필요)
#   curl -I https://cocoding.co.kr/backend/api/없는파일.php            → 404
